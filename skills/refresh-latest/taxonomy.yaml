    - cloudflare
    - nginx
    - apache
    - haproxy
    - traefik
    - ivanti
    - fortinet
    - citrix
    - palo-alto
    - vmware
    - sap
    - oracle
    - mcp
    - llm
    - claude
    - openai
    - anthropic
