    - api
    - mobile
    - cloud
    - appliance
    - on-prem
    - ai-system

# Hunt-value rubric (used by ranker)
hunt_value_rubric:
  5: "Unauth, no PoC public, fresh CVE on asset I commonly see in scope"
  4: "Auth-required but novel, OR unauth with PoC but low scanner adoption"
  3: "Variant or chain candidate of known issue"
  2: "Patched, well-known, mostly defensive interest"
  1: "Reading-only, no actionable probe"

# Severity → CVSS rough mapping (for ranker)
severity_score:
  critical: 9
  high: 7
  medium: 5
  low: 3
  info: 1
  unknown: 4
