# refresh-latest taxonomy — every published item MUST satisfy this schema.
# Items missing any required field are rejected at the publish stage.

required_fields:
  - class           # cve | technique | writeup | tool | reading
  - tags            # >= 1 from controlled vocab below
  - severity        # critical | high | medium | low | info | unknown
  - hunt_value      # 1-5 (5 = drop everything and probe now)
  - exploit_status  # poc | itw | patched | theoretical | unknown
  - freshness_days  # int — days since disclosure

# Controlled vocab. Free-form tags allowed but at least one must come from here.
tag_vocab:
  vuln_class:
    - rce
    - sqli
    - ssrf
    - xss
    - xxe
    - csrf
    - ssti
    - lfi
    - rfi
    - idor
    - auth-bypass
    - authz-bypass
    - privesc
    - desync
    - smuggling
    - deserialization
    - prototype-pollution
    - path-traversal
    - command-injection
    - prompt-injection
    - jailbreak
    - data-exfil
    - supply-chain
    - cache-poisoning
    - race-condition
    - oauth
    - jwt
    - subdomain-takeover
    - dns
    - cors
  tech:
    - nextjs
    - react
    - rails
    - django
    - laravel
    - spring
    - express
    - fastapi
    - graphql
    - grpc
    - kubernetes
    - docker
    - aws
    - gcp
